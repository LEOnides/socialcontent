# Publica solo apps/brand-studio/dist en GitHub Pages.
# El resto del repo (borradores editoriales) no entra al sitio.
name: Brand Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/brand-studio/**"
      - ".github/workflows/brand-studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brand-studio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/brand-studio/package-lock.json

      - name: Instalar y build
        working-directory: apps/brand-studio
        run: |
          npm ci
          npm run build

      - name: Subir artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/brand-studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
